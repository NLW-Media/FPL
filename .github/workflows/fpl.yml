name: FPL top-100 brief

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      free_transfers:
        description: 'Free transfers you have'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3', '4', '5']
      horizon:
        description: 'Gameweeks to project over'
        required: false
        default: '4'
        type: choice
        options: ['1', '2', '3', '4', '5', '6']
      sample:
        description: 'Managers to sample'
        required: false
        default: '500'
        type: choice
        options: ['100', '250', '500', '1000']

permissions:
  contents: write
  issues: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install requests

      - name: Run the tracker
        id: run
        run: |
          python fpl_top100.py \
            --team-id 484852 \
            --n "${{ inputs.sample || '500' }}" \
            --workers 5 \
            --window 4 \
            --horizon "${{ inputs.horizon || '4' }}" \
            --free-transfers "${{ inputs.free_transfers || '1' }}" \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          # Old reports are committed, so hashFiles() is always true. Only carry
          # on if this run actually wrote something.
          if [ -n "$(git status --porcelain reports/)" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the report
        if: steps.run.outputs.built == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "FPL brief $(date -u +%Y-%m-%d)" || exit 0
          git push

      - name: Post the brief as an issue
        if: steps.run.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GW=$(head -1 reports/latest.md | grep -o '[0-9]\+')
          gh issue create --title "FPL GW$GW brief" --body-file reports/latest.md
