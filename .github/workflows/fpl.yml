name: FPL top-100 brief

on:
  schedule:
    # Runs every hour, on the hour, UTC. The script exits immediately
    # unless the next FPL deadline is 5.5-6.5 hours away.
    - cron: '0 * * * *'
  workflow_dispatch:        # lets you press a button to run it manually

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install requests

      - name: Run the tracker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FPL_FROM: ${{ secrets.FPL_FROM }}
        run: python fpl_top100.py --email "${{ secrets.FPL_TO }}"

      - name: Keep a copy of the report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpl-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
