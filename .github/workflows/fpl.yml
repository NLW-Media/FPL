name: FPL top-100 brief

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install requests

      - name: Run the tracker
        run: python fpl_top100.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit the report
        if: hashFiles('reports/*.md') != ''
        run: |
          cp "$(ls -t reports/fpl_gw*.md | head -1)" reports/latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "FPL brief $(date -u +%Y-%m-%d)" || exit 0
          git push

      - name: Post the brief as an issue
        if: hashFiles('reports/*.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=$(ls -t reports/fpl_gw*.md | head -1)
          GW=$(basename "$FILE" .md | sed 's/fpl_gw//')
          gh issue create --title "FPL GW$GW brief" --body-file "$FILE"
