name: Close duplicate briefs (one-off)

on:
  push:
    branches: [claude/eloquent-rubin-4p55sj]
    paths: ['.github/workflows/close-dupes.yml']

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Close all but the newest issue per brief title
        run: |
          gh issue list --state open --limit 2000 --json number,title,author \
            --jq '[.[] | select(.author.login | test("github-actions"))
                       | select(.title | test("^FPL GW[0-9]+ brief$"))]
                  | group_by(.title)
                  | map(sort_by(.number) | {title: .[0].title, keep: .[-1].number,
                                            close: [.[:-1][].number]})' > plan.json
          jq -c '.[] | {title, keep, closing: (.close | length)}' plan.json
          closed=0; failed=0
          for n in $(jq -r '.[].close[]' plan.json); do
            if gh issue close "$n" --reason "not planned" >/dev/null 2>&1; then
              closed=$((closed+1))
            else
              sleep 60
              if gh issue close "$n" --reason "not planned" >/dev/null; then
                closed=$((closed+1))
              else
                failed=$((failed+1)); echo "failed #$n"
              fi
            fi
            sleep 1
          done
          echo "closed=$closed failed=$failed"
          [ "$failed" -eq 0 ]
